default_language_version:
  python: &python-version python3.14

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/adamchainz/django-upgrade
  rev: 5a815b88d9286ba45b8c1a4b56e695ff5645c65e  # frozen: 1.33.0
  hooks:
  - id: django-upgrade
    args: [--target-version, "2.2"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: mypy
    language: python
    additional_dependencies:
    - mypy>=1.10
    - django-stubs[compatible-mypy]>=5
    - django>=2.2
    - pytest-django>=4.8
    types: [python]
    files: ^(src|tests)/
    pass_filenames: false
    args: [src/django_admin_fk_links, tests]

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: a72ae8edd6eeddb9d942168912362945651212f8  # frozen: v2.30.1
  hooks:
  - id: pyproject-fmt
