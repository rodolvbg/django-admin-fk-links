[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme", "hatchling" ]

[project]
name = "django-admin-fk-links"
version = "0.1.5"
description = "Moved to django-admin-tables: this last release has no code."
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 7 - Inactive",
  "Framework :: Django",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "readme" ]
dependencies = []
optional-dependencies.dev = [
  "coverage[toml]>=7.4",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.14.8",
  "tox>=4",
  "tox-uv>=1",
]
urls.Homepage = "https://github.com/rodolvbg/django-admin-fk-links"
urls.Repository = "https://github.com/rodolvbg/django-admin-fk-links"

[dependency-groups]
dev = [
  "coverage[toml]>=7.4",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.14.8",
  "tox>=4",
  "tox-uv>=1",
]

[tool.hatch]
# PyPI's description: the README with its relative links (images, docs)
# made absolute, so they work outside GitHub too. HEAD is the repo's
# default branch, whatever its name.
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/django_admin_fk_links" ]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)\s]+\.(?:png|jpe?g|gif|svg|webp))\)'
replacement = '](https://raw.githubusercontent.com/rodolvbg/django-admin-fk-links/HEAD/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs/|CHANGELOG|CONTRIBUTING|LICENSE)[^)\s]*)\)'
replacement = '](https://github.com/rodolvbg/django-admin-fk-links/blob/HEAD/\1)'

[tool.uv]
environments = [ "python_version >= '3.10'" ]

[tool.ruff]
target-version = "py310"
line-length = 88
lint.select = [
  "B",
  "DJ",
  "E",
  "F",
  "I",
  # flake8-type-checking
  "TC",
  "UP",
]
lint.ignore = [
  # runtime-cast-value
  # Forces quoting the type argument in typing.cast(), even when the type is a
  # normal runtime import. Purely stylistic, so we ignore it.
  "TC006",
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "--cov=django_admin_fk_links --cov-report=term-missing"

[tool.coverage]
run.branch = true
run.source = [ "django_admin_fk_links" ]
report.show_missing = true
report.skip_covered = true

[tool.tox]
env_list = [ "py314", "py313", "py312", "py310" ]
env_run_base.commands = [ [ "pytest", "tests", "{posargs}" ] ]
env_run_base.deps = [ "pytest", "pytest-cov" ]
env_run_base.package = "wheel"
env_run_base.wheel_build_env = ".pkg"
