[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme", "hatchling" ]

[project]
name = "django-admin-fk-links"
version = "0.1.4"
description = "Reusable Django admin mixin that turns ForeignKey fields into direct links to their related admin change views."
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
requires-python = ">=3.7"
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 2.2",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "readme" ]
dependencies = [ "django>=2.2" ]
optional-dependencies.dev = [
  "coverage[toml]>=7.4",
  "django-stubs[compatible-mypy]>=5",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "ruff>=0.14.8",
  "tox>=4",
  "tox-uv>=1",
]
urls.Homepage = "https://github.com/rodolvbg/django-admin-fk-links"
urls.Repository = "https://github.com/rodolvbg/django-admin-fk-links"

[dependency-groups]
dev = [
  "coverage[toml]>=7.4",
  "django-stubs[compatible-mypy]>=5",
  "django-unfold>=0.108; python_version>='3.12'",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "ruff>=0.14.8",
  "tox>=4",
  "tox-uv>=1",
]

[tool.hatch]
# PyPI's description: the README with its relative links (images, docs)
# made absolute, so they work outside GitHub too. HEAD is the repo's
# default branch, whatever its name.
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/django_admin_fk_links" ]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)\s]+\.(?:png|jpe?g|gif|svg|webp))\)'
replacement = '](https://raw.githubusercontent.com/rodolvbg/django-admin-fk-links/HEAD/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs/|CHANGELOG|CONTRIBUTING|LICENSE)[^)\s]*)\)'
replacement = '](https://github.com/rodolvbg/django-admin-fk-links/blob/HEAD/\1)'

[tool.uv]
environments = [ "python_version >= '3.10'" ]

[tool.ruff]
target-version = "py37"
line-length = 88
extend-exclude = [ "**/migrations/*.py" ]
lint.select = [ "B", "DJ", "E", "F", "I", "UP" ]

[tool.mypy]
mypy_path = "src"
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.python_files = [ "test_*.py" ]
ini_options.addopts = "--cov=django_admin_fk_links --cov-report=term-missing"
ini_options.django_find_project = false
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.branch = true
run.source = [ "django_admin_fk_links" ]
report.show_missing = true
report.skip_covered = true

[tool.tox]
env_list = [
  "py314-dj60",
  "py312-dj42",
  "py312-dj50",
  "py312-dj60",
  "py310-dj32",
  "py310-dj50",
  "py39-dj22",
  "py38-dj22",
  "py38-dj32",
  "py38-dj42",
]
env_run_base.commands = [ [ "pytest" ] ]
env_run_base.deps = [
  "pytest",
  "pytest-django",
  "pytest-cov",
  { replace = "if", condition = "factor.dj22", then = [ "django>=2.2,<2.3" ], extend = true },
  { replace = "if", condition = "factor.dj32", then = [ "django>=3.2,<3.3" ], extend = true },
  { replace = "if", condition = "factor.dj42", then = [ "django>=4.2,<4.3" ], extend = true },
  { replace = "if", condition = "factor.dj50", then = [ "django>=5.0,<5.1" ], extend = true },
  { replace = "if", condition = "factor.dj60", then = [ "django>=6.0,<6.1" ], extend = true },
]
env_run_base.package = "wheel"
env_run_base.wheel_build_env = ".pkg"
