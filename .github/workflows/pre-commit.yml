name: Pre-commit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The hooks run on python3.14 (default_language_version), found
      # through the venv's bin on PATH under `uv run`.
      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
